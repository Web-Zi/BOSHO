<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Bosho | البوشو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#fff6e6;--card:#fff;--ink:#241608;--mute:#7a6650;--fire:#f28c1b;--ember:#c4411a;--line:#ecd9b8;--shadow:rgba(120,60,0,.18)}
:root[data-theme=dark]{--bg:#16100a;--card:#231910;--ink:#fbeedb;--mute:#b79d7f;--line:#3a2a1a;--shadow:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background .3s,color .3s;padding-bottom:90px;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid var(--fire);outline-offset:2px}

header.top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-family:Bungee,Cairo;font-size:1.4rem;color:var(--fire)}
.tools{display:flex;gap:8px}
.tools button{border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:800;background:var(--card)}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 20px 20px;background:radial-gradient(circle at 50% 100%,var(--fire),transparent 75%);position:relative}
.hero h1{font-family:Bungee,Cairo;font-size:clamp(2.2rem,8vw,4.5rem);color:var(--ink);line-height:1.1}
.hero p{color:var(--mute);margin:6px 0 16px;font-weight:600}

/* 3D WebGL Canvas Stage */
.stage-container{
  width:100%;
  max-width:440px;
  height:280px;
  margin:10px auto 15px;
  position:relative;
  cursor:grab;
  touch-action:none;
}
.stage-container:active{cursor:grabbing}
#webgl-canvas{width:100%;height:100%;display:block;outline:none}

.info{font-weight:800;color:var(--ember);margin-top:6px}
nav.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;position:sticky;top:55px;z-index:15;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
nav.cats::-webkit-scrollbar{display:none}
nav.cats a{white-space:nowrap;padding:8px 16px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-weight:800;text-decoration:none;color:var(--ink);font-size:.9rem}
nav.cats a:hover{border-color:var(--fire)}

.search{display:block;margin:14px auto 0;width:min(100%,480px);padding:11px 18px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}

/* Container Paddings Fix */
main{max-width:1100px;margin:auto;padding:0 24px}
section{padding-top:60px;margin-top:-30px}
section h2{font-size:1.6rem;font-weight:900;margin:20px 0 14px;display:flex;gap:10px;align-items:center}
section h2::after{content:"";flex:1;height:3px;background:linear-gradient(90deg,var(--fire),transparent);border-radius:99px}
[dir=rtl] section h2::after{background:linear-gradient(270deg,var(--fire),transparent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;perspective:900px}
.item{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .2s;transform-style:preserve-3d;box-shadow:0 6px 18px var(--shadow)}
.item h3{font-size:1.05rem;font-weight:800;transform:translateZ(18px);line-height:1.3}
.item small{color:var(--mute);font-size:.82rem;line-height:1.4}
.new{background:var(--ember);color:#fff;border-radius:6px;padding:1px 6px;font-size:.7rem;margin-inline-start:6px;display:inline-block}

/* Safe row formatting for prices and add buttons */
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;transform:translateZ(26px)}
.price{font-weight:900;color:var(--ember);font-size:1.15rem;white-space:nowrap}
[data-theme=dark] .price{color:var(--fire)}
.add{background:var(--fire);color:#241608;font-weight:900;border-radius:99px;padding:7px 18px;white-space:nowrap}
.add:active{transform:scale(.92)}

.qty{display:flex;align-items:center;gap:8px;font-weight:900}
.qty button{width:32px;height:32px;border-radius:50%;background:var(--fire);color:#241608;font-weight:900;display:grid;place-items:center}

.fab{position:fixed;bottom:16px;inset-inline:20px;max-width:500px;margin:auto;background:var(--ember);color:#fff;border-radius:99px;padding:14px 22px;font-weight:900;display:flex;justify-content:space-between;box-shadow:0 10px 30px var(--shadow);z-index:30;transition:transform .3s}
.fab.hide{transform:translateY(150%)}
.fab.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.06)}}

.drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.drawer.open{display:flex}
.sheet{background:var(--bg);width:min(100%,560px);max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px;animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h2{font-weight:900;margin-bottom:12px;display:flex;justify-content:space-between}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line b{flex:1}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:1.2rem;padding:14px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.seg button{padding:10px;border-radius:12px;border:2px solid var(--line);font-weight:800;background:var(--card)}
.seg button.on{border-color:var(--fire);background:var(--fire);color:#241608}
.sheet input,.sheet textarea{width:100%;padding:11px;margin:5px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.sheet input.bad{border-color:#d22}
.loc{width:100%;padding:10px;border-radius:12px;border:2px dashed var(--fire);font-weight:800;margin:4px 0}
.send{width:100%;padding:14px;border-radius:99px;background:#25d366;color:#08210f;font-weight:900;font-size:1.05rem;margin-top:10px}
.msg{color:var(--mute);font-size:.85rem;text-align:center;margin-top:6px}
.empty{text-align:center;color:var(--mute);padding:30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    const its=c.i.map((x,n)=>[x,n]).filter(([x])=>!f||x[0].includes(f)||x[1].toLowerCase().includes(f));
    if(!its.length)return"";
    return `<section id="${c.id}"><h2>${c.ic} ${c[lang]}</h2><div class="grid">${its.map(([x,n])=>{
      const k=c.id+n,q=cart[k]||0;
      return `<div class="item"><h3>${nm(x)}${x[3]?`<span class="new">${t("new")}</span>`:""}</h3>${ds(x)?`<small>${ds(x)}</small>`:""}
      <div class="row"><span class="price">${fmt(x[2])}</span>${q?`<span class="qty"><button data-d="-1" data-k="${k}">−</button>${q}<button data-d="1" data-k="${k}">${t("add")}</button></span>`:`<button class="add" data-d="1" data-k="${k}">${t("add")}</button>`}</div></div>`}).join("")}</div></section>`}).join("")||`<p class="empty">—</p>`;
  bar(); lines();
}

function bar(pop){
  const n=cnt(); $("#fab").classList.toggle("hide",!n);
  $("#fabN").textContent=`🛒 ${t("view")} (${n} ${t("items")})`; $("#fabT").textContent=fmt(sum());
  if(pop){$("#fab").classList.remove("pop");void $("#fab").offsetWidth;$("#fab").classList.add("pop")}
}

function lines(){
  const e=Object.entries(cart);
  $("#lines").innerHTML=e.length?e.map(([k,q])=>`<div class="line"><b>${nm(flat[k])}</b><span class="qty"><button data-d="-1" data-k="${k}">−</button>${q}<button data-d="1" data-k="${k}">${t("add")}</button></span><span>${fmt(flat[k][2]*q)}</span></div>`).join(""):`<p class="empty">${t("empty")}</p>`;
  $("#tot").textContent=fmt(sum());
}

function change(k,d){
  cart[k]=(cart[k]||0)+d; if(cart[k]<=0)delete cart[k];
  localStorage.cart=JSON.stringify(cart); render(); bar(d>0);
  if(!cnt())$("#dr").classList.remove("open");
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-k]"); if(b)change(b.dataset.k,+b.dataset.d);
});
$("#q").addEventListener("input",e=>{filter=e.target.value;render()});
$("#tTheme").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.theme=theme;render();if(window.update3DTheme)window.update3DTheme();};
$("#tLang").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.lang=lang;render()};
$("#fab").onclick=()=>$("#dr").classList.add("open");
$("#x").onclick=()=>$("#dr").classList.remove("open");
$("#dr").onclick=e=>{if(e.target.id==="dr")$("#dr").classList.remove("open")};

function setMode(m){mode=m;$("#mDel").classList.toggle("on",m==="del");$("#mPick").classList.toggle("on",m==="pick");$("#delBox").style.display=m==="del"?"block":"none"}
$("#mDel").onclick=()=>setMode("del"); $("#mPick").onclick=()=>setMode("pick");

$("#locBtn").onclick=()=>{
  navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{loc=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;$("#locBtn").textContent=t("locOk")},()=>alert(t("locErr")),{enableHighAccuracy:true,timeout:10000}):alert(t("locErr"));
};

$("#send").onclick=()=>{
  const name=$("#name").value.trim(), phone=$("#phone").value.replace(/[\s-]/g,""), addr=$("#addr").value.trim();
  $("#phone").classList.toggle("bad",!/^(\+?20|0)?1[0-25]\d{8}$/.test(phone)&&!/^\+?\d{9,15}$/.test(phone));
  if(!cnt())return;
  if($("#phone").classList.contains("bad"))return alert(t("badPhone"));
  if(!name||(mode==="del"&&!addr&&!loc))return alert(t("need"));

  let m=`*طلب جديد - البوشو*\n\n`;
  Object.entries(cart).forEach(([k,q])=>m+=`• ${flat[k][0]} × ${q} = ${flat[k][2]*q} ج\n`);
  m+=`\n*الإجمالي: ${sum()} ج* (بدون رسوم التوصيل)\n\n`;
  m+=`الاسم: ${name}\nالموبايل: ${phone}\nنوع الطلب: ${mode==="del"?"توصيل":"استلام من المطعم"}\n`;
  if(mode==="del"){if(addr)m+=`العنوان: ${addr}\n`;if(loc)m+=`الموقع: ${loc}\n`}
  const note=$("#note").value.trim(); if(note)m+=`ملاحظات: ${note}\n`;
  open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(m)}`,"_blank");
};

/* 3D tilt on cards */
document.addEventListener("mousemove",e=>{
  const c=e.target.closest(".item"); document.querySelectorAll(".item").forEach(i=>{if(i!==c)i.style.transform=""});
  if(!c)return; const r=c.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  c.style.transform=`rotateY(${x*14}deg) rotateX(${-y*14}deg) translateZ(8px)`;
});

render(); setMode("del");

/* ====================================================================
   EXACT ARTWORK THREE.JS 3D SHOWCASE ENGINE (BURGER + CREPE + SUB)
   ==================================================================== */
(function initExactArtworkStage(){
  const canvas = document.getElementById("webgl-canvas");
  const container = canvas.parentElement;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 1.8, 5.5);

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: "high-performance" });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xfff5e6, 1.3);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffeedd, 1.6);
  dirLight.position.set(3, 7, 5);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 15;
  dirLight.shadow.bias = -0.001;
  scene.add(dirLight);

  const fillLight = new THREE.PointLight(0xf28c1b, 1.0, 10);
  fillLight.position.set(-4, 2, 2);
  scene.add(fillLight);

  // Group Pivot
  const mainGroup = new THREE.Group();
  scene.add(mainGroup);

  // Circular Ceramic Plate Base
  const plateGeo = new THREE.CylinderGeometry(2.3, 2.1, 0.12, 64);
  const plateMat = new THREE.MeshStandardMaterial({
    color: theme === 'dark' ? 0x2e2016 : 0xf7ede2,
    roughness: 0.2,
    metalness: 0.1
  });
  const plateMesh = new THREE.Mesh(plateGeo, plateMat);
  plateMesh.position.y = -0.4;
  plateMesh.receiveShadow = true;
  mainGroup.add(plateMesh);

  // Inner Plate Lip
  const lipGeo = new THREE.TorusGeometry(2.15, 0.05, 16, 64);
  const lipMesh = new THREE.Mesh(lipGeo, plateMat);
  lipMesh.rotation.x = Math.PI / 2;
  lipMesh.position.y = -0.34;
  lipMesh.receiveShadow = true;
  mainGroup.add(lipMesh);

  // Shadow Receiver Ground Plane
  const shadowPlaneGeo = new THREE.PlaneGeometry(10, 10);
  const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.25 });
  const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
  shadowPlane.rotation.x = -Math.PI / 2;
  shadowPlane.position.y = -0.41;
  shadowPlane.receiveShadow = true;
  scene.add(shadowPlane);

  // Helper: Draw Procedural Food Canvas Textures (Exact Match Artwork)
  function createArtworkTexture(type) {
    const c = document.createElement("canvas");
    c.width = 512; c.height = 512;
    const ctx = c.getContext("2d");

    ctx.clearRect(0, 0, 512, 512);
    ctx.lineCap = "round"; ctx.lineJoin = "round";

    if (type === "burger") {
      // Top Bun
      ctx.fillStyle = "#e59847"; ctx.strokeStyle = "#4a2306"; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(256, 190, 130, Math.PI, 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      // Bun Highlight
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.beginPath(); ctx.arc(220, 130, 60, Math.PI*1.1, Math.PI*1.8); ctx.fill();
      // Seeds
      ctx.fillStyle = "#fff8e7";
      [[200,120],[250,100],[300,125],[170,150],[230,150],[280,160],[320,150]].forEach(([x,y]) => {
        ctx.beginPath(); ctx.ellipse(x, y, 6, 3, 0.4, 0, Math.PI*2); ctx.fill();
      });
      // Lettuce
      ctx.fillStyle = "#70c039"; ctx.strokeStyle = "#27500b"; ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(110, 195);
      for(let x=110; x<=400; x+=35) {
        ctx.quadraticCurveTo(x+15, 220, x+35, 195);
      }
      ctx.lineTo(400, 215); ctx.lineTo(110, 215); ctx.closePath();
      ctx.fill(); ctx.stroke();
      // Tomato Slices
      ctx.fillStyle = "#e73e28"; ctx.strokeStyle = "#5a0f06"; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.roundRect(125, 215, 110, 22, 8); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(265, 215, 115, 22, 8); ctx.fill(); ctx.stroke();
      // Melted Cheese
      ctx.fillStyle = "#f3b922"; ctx.strokeStyle = "#6d4b00"; ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(110, 237); ctx.lineTo(400, 237);
      ctx.lineTo(370, 280); ctx.lineTo(310, 245);
      ctx.lineTo(240, 290); ctx.lineTo(180, 245); ctx.lineTo(130, 275);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // Beef Patty
      ctx.fillStyle = "#5c2c16"; ctx.strokeStyle = "#230e04"; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.roundRect(110, 260, 290, 48, 16); ctx.fill(); ctx.stroke();
      // Bottom Lettuce
      ctx.fillStyle = "#65b530"; ctx.strokeStyle = "#27500b"; ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(120, 308);
      for(let x=120; x<=390; x+=30) { ctx.quadraticCurveTo(x+12, 325, x+30, 308); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // Bottom Bun
      ctx.fillStyle = "#d38334"; ctx.strokeStyle = "#4a2306"; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.roundRect(125, 318, 260, 42, [6,6,20,20]); ctx.fill(); ctx.stroke();

    } else if (type === "crepe") {
      // Golden Crispy Crepe Cone (Folded Triangle)
      ctx.fillStyle = "#eeb868"; ctx.strokeStyle = "#4a2306"; ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(256, 420);
      ctx.quadraticCurveTo(100, 260, 120, 120);
      ctx.quadraticCurveTo(256, 170, 392, 120);
      ctx.quadraticCurveTo(410, 260, 256, 420);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // Fold Over Flap
      ctx.fillStyle = "#f5cb85";
      ctx.beginPath();
      ctx.moveTo(120, 120);
      ctx.quadraticCurveTo(256, 210, 392, 120);
      ctx.quadraticCurveTo(256, 280, 120, 120);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // Brown Toast/Grid Speckles
      ctx.fillStyle = "rgba(139, 69, 19, 0.35)";
      [[210,220],[280,240],[240,300],[200,330],[290,320],[250,370],[180,260]].forEach(([x,y]) => {
        ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI*2); ctx.fill();
      });

      // Topping/Sauce Drizzle inside
      ctx.fillStyle = "#c4411a"; ctx.strokeStyle = "#5a0f06"; ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(150, 140);
      ctx.quadraticCurveTo(200, 170, 250, 145);
      ctx.quadraticCurveTo(300, 170, 360, 135);
      ctx.quadraticCurveTo(310, 190, 250, 165);
      ctx.quadraticCurveTo(190, 190, 150, 140);
      ctx.fill(); ctx.stroke();

    } else if (type === "sub") {
      // Submarine Sandwich / Baguette
      ctx.fillStyle = "#df9441"; ctx.strokeStyle = "#4a2306"; ctx.lineWidth = 10;
      // Top Baguette Bun
      ctx.beginPath();
      ctx.ellipse(256, 190, 180, 50, -0.08, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();

      // Baguette Diagonal Score Cuts
      ctx.strokeStyle = "#8b4513"; ctx.lineWidth = 7;
      [[150,175,190,195],[220,170,260,195],[290,170,330,195],[360,175,390,195]].forEach(([x1,y1,x2,y2]) => {
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      });

      // Fillings (Ham, Cheese, Lettuce)
      ctx.fillStyle = "#70c039"; ctx.strokeStyle = "#27500b"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.roundRect(80, 220, 350, 20, 10); ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#f3b922"; ctx.strokeStyle = "#6d4b00"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.roundRect(95, 235, 320, 18, 8); ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#b83b28"; ctx.strokeStyle = "#4a0d05"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.roundRect(110, 248, 290, 22, 10); ctx.fill(); ctx.stroke();

      // Bottom Baguette Bun
      ctx.fillStyle = "#c77a28"; ctx.strokeStyle = "#4a2306"; ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.ellipse(256, 275, 170, 40, -0.08, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    }

    const texture = new THREE.CanvasTexture(c);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    return texture;
  }

  // Create 3D Cutout Planes for Food Items
  function createArtwork3DPlane(type, width, height) {
    const tex = createArtworkTexture(type);
    const geo = new THREE.PlaneGeometry(width, height);
    const mat = new THREE.MeshStandardMaterial({
      map: tex,
      transparent: true,
      alphaTest: 0.1,
      roughness: 0.4,
      metalness: 0.05,
      side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  // Build the 3 Items on top of the Plate Base
  const burgerMesh = createArtwork3DPlane("burger", 1.8, 1.8);
  burgerMesh.position.set(-0.85, 0.35, 0.4);
  burgerMesh.rotation.y = 0.2;
  mainGroup.add(burgerMesh);

  const crepeMesh = createArtwork3DPlane("crepe", 1.6, 1.6);
  crepeMesh.position.set(0.75, 0.65, -0.2);
  crepeMesh.rotation.y = -0.3;
  mainGroup.add(crepeMesh);

  const subMesh = createArtwork3DPlane("sub", 2.1, 1.3);
  subMesh.position.set(0.1, -0.05, 0.7);
  subMesh.rotation.z = -0.08;
  mainGroup.add(subMesh);

  // Theme Update Listener
  window.update3DTheme = function() {
    plateMat.color.setHex(theme === 'dark' ? 0x2e2016 : 0xf7ede2);
  };

  // Drag & Touch Interaction
  let isDragging = false, prevMouseX = 0, prevMouseY = 0;
  let targetRotY = 0, targetRotX = 0;

  function onPointerDown(e) {
    isDragging = true;
    const p = e.touches ? e.touches[0] : e;
    prevMouseX = p.clientX;
    prevMouseY = p.clientY;
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    const p = e.touches ? e.touches[0] : e;
    const deltaX = p.clientX - prevMouseX;
    const deltaY = p.clientY - prevMouseY;
    targetRotY += deltaX * 0.008;
    targetRotX += deltaY * 0.005;
    targetRotX = Math.max(-0.4, Math.min(0.6, targetRotX));
    prevMouseX = p.clientX;
    prevMouseY = p.clientY;
  }

  function onPointerUp() { isDragging = false; }

  container.addEventListener("mousedown", onPointerDown);
  window.addEventListener("mousemove", onPointerMove);
  window.addEventListener("mouseup", onPointerUp);

  container.addEventListener("touchstart", onPointerDown, { passive: true });
  window.addEventListener("touchmove", onPointerMove, { passive: true });
  window.addEventListener("touchend", onPointerUp);

  // Smooth Render Loop
  let clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();

    // Auto Gentle Orbit Rotation if not dragging
    if (!isDragging) {
      targetRotY += 0.004;
    }

    // Spring Inertia Smooth Interpolation
    mainGroup.rotation.y += (targetRotY - mainGroup.rotation.y) * 0.08;
    mainGroup.rotation.x += (targetRotX - mainGroup.rotation.x) * 0.08;

    // Subtle Float Animation for Each Item
    burgerMesh.position.y = 0.35 + Math.sin(time * 2.2) * 0.04;
    crepeMesh.position.y = 0.65 + Math.sin(time * 2.2 + 1.2) * 0.05;
    subMesh.position.y = -0.05 + Math.sin(time * 2.2 + 2.4) * 0.03;

    renderer.render(scene, camera);
  }

  animate();

  // Responsive Resize
  window.addEventListener("resize", () => {
    const w = container.clientWidth, h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();
</script>
